<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIO PVP — rankings</title>
<meta name="description" content="Rankings, tiers and matches on the MIO PVP Minecraft server (miopvp.com).">
<link rel="icon" href="logo-ikona.png" type="image/png">
<link rel="apple-touch-icon" href="logo-ikona.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styl.css">
</head>
<body>
<header>
  <div class="pasek">
    <a class="logo" href="#ranking/ogolny" aria-label="MIO PVP — rankings">
      <!-- Logo: napis przecięty ukośnie; dolna połowa przesunięta jak po cięciu mieczem. -->
      <svg width="163" height="34" viewBox="0 0 230 48" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="logo-mio" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#efeff1"/><stop offset="1" stop-color="#9d9daa"/></linearGradient>
          <linearGradient id="logo-pvp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9c9d1"/><stop offset="1" stop-color="#6e6e78"/></linearGradient>
          <clipPath id="logo-gora"><polygon points="0,0 230,0 230,14 0,30"/></clipPath>
          <clipPath id="logo-dol"><polygon points="0,30 230,14 230,48 0,48"/></clipPath>
        </defs>
        <g font-family="Archivo, 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="40" letter-spacing="1">
          <g class="logo-gora" clip-path="url(#logo-gora)"><text x="4" y="41" fill="url(#logo-mio)">MIO</text><text x="100" y="41" fill="url(#logo-pvp)">PVP</text></g>
          <g class="logo-dol" clip-path="url(#logo-dol)" transform="translate(3 2)"><text x="4" y="41" fill="url(#logo-mio)">MIO</text><text x="100" y="41" fill="url(#logo-pvp)">PVP</text></g>
        </g>
        <line class="logo-ciecie" pathLength="1" x1="-2" y1="31.5" x2="222" y2="15" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
        <circle class="logo-czubek" cx="222" cy="15" r="2.5" fill="#ffffff"/>
      </svg>
    </a>
    <nav>
      <a id="nav-ranking" href="#ranking/ogolny">Rankings</a>
      <a id="nav-mecze" href="#mecze">Matches</a>
      <a id="nav-tiery" href="#tiery">Tiers</a>
    </nav>
    <form id="szukaj" class="szukaj" autocomplete="off">
      <input id="szukaj-pole" list="nicki" placeholder="Find a player (press /)" aria-label="Find a player">
      <datalist id="nicki"></datalist>
    </form>
    <span class="online" hidden></span>
    <button class="graj kopiuj-adres" type="button" title="Copy the server address">Play: miopvp.com</button>
  </div>
</header>

<main id="tresc"><p class="info">Loading…</p></main>

<footer>
  <p class="stopka-zach">Join the server. Click the address to copy it. <span class="online" hidden></span></p>
  <button class="adres kopiuj-adres" type="button" aria-label="Copy the server address miopvp.com">miopvp.com</button>
  <div class="stopka-dol">
    <span id="zaktualizowano"></span>
    <span>Item icons: Minecraft textures (Mojang). Skins: mc-heads.net.</span>
  </div>
</footer>

<script src="strona.js"></script>
</body>
</html>
